<rect x="0" y="0" width="600" height="790" rx="0" fill="#080e1a" stroke="#080e1a"/><rect width="600" height="790" fill="url(#grid)" opacity=".24"/><ellipse cx="370" cy="240" rx="410" ry="320" fill="url(#glow)"/><text x="32" y="34" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">VISHAL KUSHWAHA / SOFTWARE DEVELOPER</text><path d="M32 52H568" fill="none" stroke="#283c57" stroke-width="1"/><rect x="32" y="76" width="211" height="30" rx="4" fill="#10233b" stroke="#283c57"/><text x="44" y="97" class="mono" font-size="14" fill="#60cfff" >OPEN TO COLLABORATE</text><text x="32" y="153" class="mono" font-size="23" fill="#9cacc4" >Hello there, I’m</text><text x="26" y="267" class="display" font-size="126" fill="#f2f5fc" >VISHAL</text><text x="26" y="382" class="display" font-size="102" fill="#178cff" textLength="536" lengthAdjust="spacingAndGlyphs">KUSHWAHA</text><g transform="translate(480 171)"><path d="M0 14L7 0H14L7 14ZM10 14L17 0H24L17 14ZM20 14L27 0H34L27 14Z" fill="#ff4655"/></g><text x="480" y="220" class="display" font-size="26" fill="#f2f5fc" >BUILD.</text><text x="480" y="248" class="display" font-size="26" fill="#f2f5fc" >LEARN.</text><text x="480" y="276" class="display" font-size="26" fill="#f2f5fc" >SHARE.</text><text x="32" y="424" class="mono" font-size="21" fill="#f2f5fc" >BACKEND ENGINEERING × WEB × AI</text><text x="32" y="456" class="body" font-size="18" fill="#9cacc4" >Building useful products. Exploring what’s next.</text><rect x="32" y="490" width="536" height="214" rx="8" fill="url(#card)" stroke="#315883"/><text x="54" y="521" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">DEVELOPER / BUILDER / EXPLORER</text><text x="58" y="631" class="display" font-size="94" fill="#f2f5fc" >VK</text><text x="230" y="570" class="mono" font-size="19" fill="#60cfff" >&gt; developer.status</text><text x="230" y="608" class="mono" font-size="23" fill="#f2f5fc" >creating</text><text x="230" y="642" class="mono" font-size="20" fill="#9cacc4" >learning + sharing</text><g transform="translate(514 669)"><path d="M0 14L7 0H14L7 14ZM10 14L17 0H24L17 14ZM20 14L27 0H34L27 14Z" fill="#ff4655"/></g><path d="M32 747H568" fill="none" stroke="#283c57" stroke-width="1"/><text x="32" y="774" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">JAVA / SPRING BOOT / REACT / PYTHON</text>

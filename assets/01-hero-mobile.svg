<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title desc">
<title id="title">Vishal Kushwaha — Software Developer</title><desc id="desc">Building practical software at the intersection of backend engineering, web and AI. Open to collaboration.</desc>

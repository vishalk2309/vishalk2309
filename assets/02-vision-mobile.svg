<rect x="0" y="0" width="600" height="830" rx="0" fill="#110d12" stroke="none"/><rect width="600" height="830" fill="url(#paper)"/><text x="36" y="39" class="mono" font-size="13" fill="#c3a9ad"  letter-spacing="1.6">01 / THE PERSON BEHIND THE COMMITS</text><text x="36" y="99" class="serif" font-size="43" fill="#f5eade"  >Hello, I’m Vishal.</text><path d="M558 92l4 4l-4 4l-4-4Z" fill="#d1ad7c"/><g transform="translate(36 137)"><rect x="0" y="0" width="528" height="300" rx="4" fill="#1a121a" stroke="#55323e"/><rect x="0" y="0" width="528" height="38" rx="4" fill="#2b1923" stroke="#55323e"/><text x="22" y="25" class="mono" font-size="12" fill="#c3a9ad"  letter-spacing="1.6">DEVELOPER.JS</text><path d="M506 17l3 3l-3 3l-3-3Z" fill="#d1ad7c"/><text x="22" y="85" class="mono" font-size="19" fill="#e2a5b3"  >const developer = {</text><text x="22" y="121" class="mono" font-size="19" fill="#f5eade"  >  name: &quot;Vishal Kushwaha&quot;,</text><text x="22" y="157" class="mono" font-size="19" fill="#f5eade"  >  focus: [&quot;backend&quot;,&quot;web&quot;,&quot;ai&quot;],</text><text x="22" y="193" class="mono" font-size="19" fill="#d1ad7c"  >  mindset: 'learn, build, share'</text><text x="22" y="229" class="mono" font-size="19" fill="#e2a5b3"  >};</text><path d="M22 256h484" fill="none" stroke="#55323e"/><text x="22" y="283" class="italic" font-size="18" fill="#c3a9ad"  >Always curious. Always a work in progress.</text></g><g transform="translate(36 458)"><rect x="0" y="0" width="528" height="300" rx="4" fill="url(#card)" stroke="#55323e"/><text x="24" y="47" class="serif" font-size="30" fill="#f5eade"  >A little more than code.</text><text x="24" y="94" class="mono" font-size="17" fill="#d1ad7c"  >01</text><text x="70" y="93" class="serif" font-size="24" fill="#f5eade"  >Backend &amp; web</text><text x="70" y="118" class="body" font-size="17" fill="#c3a9ad"  >Java, Spring Boot, React and REST APIs.</text><path d="M70 134h434" fill="none" stroke="#55323e"/><text x="24" y="163" class="mono" font-size="17" fill="#d1ad7c"  >02</text><text x="70" y="162" class="serif" font-size="24" fill="#f5eade"  >AI Workhub</text><text x="70" y="187" class="body" font-size="17" fill="#c3a9ad"  >Building tools for project collaboration.</text><path d="M70 203h434" fill="none" stroke="#55323e"/><text x="24" y="232" class="mono" font-size="17" fill="#d1ad7c"  >03</text><text x="70" y="231" class="serif" font-size="24" fill="#f5eade"  >EngiSync</text><text x="70" y="256" class="body" font-size="17" fill="#c3a9ad"  >Sharing resources, learning and opportunity.</text></g>

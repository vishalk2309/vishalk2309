<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Ideas into impact</title><desc id="desc">Backend and web engineering, AI Workhub project collaboration, and EngiSync community resources.</desc>
<defs>
  <radialGradient id="glow"><stop stop-color="#0767cf" stop-opacity=".4"/><stop offset="1" stop-color="#0767cf" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#123a68"/><stop offset="1" stop-color="#0b1729"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3655" stroke-width=".7"/></pattern>
  <style>.body{font-family:'Segoe UI',Arial,sans-serif;font-weight:500}.display{font-family:Impact,'Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:900;letter-spacing:.2px}.mono{font-family:Consolas,'Liberation Mono',monospace;font-weight:600}</style>
</defs>
<rect x="0" y="0" width="1200" height="510" rx="0" fill="#080e1a" stroke="#080e1a"/><rect width="1200" height="510" fill="url(#grid)" opacity=".24"/><text x="32" y="40" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">01 / FROM CURIOSITY TO CREATION</text><text x="32" y="89" class="display" font-size="44" fill="#f2f5fc" >IDEAS INTO IMPACT.</text><g transform="translate(32 124)"><rect x="0" y="0" width="558" height="356" rx="12" fill="#0d1728" stroke="#315883"/><rect x="0" y="0" width="558" height="5" rx="0" fill="#178cff" stroke="none"/><text x="24" y="40" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">THE BUILDER’S MINDSET</text><text x="24" y="86" class="display" font-size="36" fill="#f2f5fc" >THINK. BUILD. IMPROVE.</text><rect x="24" y="110" width="510" height="199" rx="6" fill="#081321" stroke="#244467"/><rect x="24" y="110" width="510" height="29" rx="6" fill="#153151" stroke="#244467"/><circle cx="40" cy="125" r="4" fill="#ff4655"/><circle cx="54" cy="125" r="4" fill="#e8b15b"/><circle cx="68" cy="125" r="4" fill="#5bcfa0"/><text x="88" y="129" class="mono" font-size="13" fill="#9cacc4" >vishal / workspace</text><text x="44" y="169" class="mono" font-size="18" fill="#60cfff" >&gt; turn_curiosity_into_impact()</text><rect x="44" y="192" width="120" height="30" rx="4" fill="#10233b" stroke="#283c57"/><text x="56" y="213" class="mono" font-size="14" fill="#178cff" >01 / LEARN</text><rect x="192" y="192" width="120" height="30" rx="4" fill="#10233b" stroke="#283c57"/><text x="204" y="213" class="mono" font-size="14" fill="#178cff" >02 / BUILD</text><rect x="340" y="192" width="142" height="30" rx="4" fill="#10233b" stroke="#283c57"/><text x="352" y="213" class="mono" font-size="14" fill="#ff4655" >03 / SHARE</text><text x="44" y="256" class="body" font-size="18" fill="#f2f5fc" >Reliable APIs. Thoughtful interfaces.</text><text x="44" y="285" class="body" font-size="17" fill="#9cacc4" >Experiments that become useful software.</text><text x="24" y="339" class="mono" font-size="16" fill="#9cacc4" >// Always a work in progress.</text></g><g transform="translate(610 124)"><rect x="0" y="0" width="558" height="356" rx="12" fill="#0d1728" stroke="#64404f"/><rect x="0" y="0" width="558" height="5" rx="0" fill="#ff4655" stroke="none"/><text x="24" y="40" class="mono" font-size="16" fill="#9cacc4" letter-spacing="2">MORE THAN JUST CODE</text><text x="24" y="86" class="display" font-size="34" fill="#f2f5fc" >ENGINEERING + COMMUNITY</text><text x="24" y="143" class="display" font-size="31" fill="#178cff" >01</text><text x="80" y="137" class="display" font-size="21" fill="#f2f5fc" >BACKEND &amp; WEB</text><text x="80" y="163" class="body" font-size="17" fill="#9cacc4" >Java, Spring Boot, React and REST APIs.</text><path d="M80 177H534" fill="none" stroke="#283c57" stroke-width="1"/><text x="24" y="216" class="display" font-size="31" fill="#178cff" >02</text><text x="80" y="210" class="display" font-size="21" fill="#f2f5fc" >AI WORKHUB</text><text x="80" y="236" class="body" font-size="17" fill="#9cacc4" >Building tools for project collaboration.</text><path d="M80 250H534" fill="none" stroke="#283c57" stroke-width="1"/><text x="24" y="289" class="display" font-size="31" fill="#ff4655" >03</text><text x="80" y="283" class="display" font-size="21" fill="#f2f5fc" >ENGISYNC</text><text x="80" y="309" class="body" font-size="17" fill="#9cacc4" >Sharing resources, learning and opportunity.</text></g>
</svg>

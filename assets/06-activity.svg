<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-labelledby="title desc">
<title id="title">GitHub activity</title><desc id="desc">Live GitHub statistics and contribution calendar follow this heading.</desc>
<defs>
  <radialGradient id="glow"><stop stop-color="#0767cf" stop-opacity=".4"/><stop offset="1" stop-color="#0767cf" stop-opacity="0"/></radialGradient>
